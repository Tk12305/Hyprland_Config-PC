# ╔══════════════════════════════════════════════════════╗
# ║          HYPRLAND CONFIG — COSMIC VOYAGER          ║
# ╚══════════════════════════════════════════════════════╝

monitor=,preferred,auto,1

source = /home/toby/.config/hypr/monitors.conf

exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = DISPLAY,:0
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = 0
    scroll_factor = 1
}




general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border   = rgba(4B0082ff) rgba(00FFFFff) 45deg
    col.inactive_border = rgba(000080aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = false
    }
    active_opacity   = 1.0
    inactive_opacity = 0.92
}

animations {
    enabled = yes
    bezier = moonrise,  0.16, 1, 0.3, 1
    bezier = drift,     0.4,  0, 0.2, 1
    bezier = snap,      0.68,-0.55, 0.27, 1.55
    animation = windows,     1, 5,  moonrise, slide
    animation = windowsOut,  1, 4,  drift,    slide
    animation = border,      1, 10, default
    animation = borderangle, 1, 8,  drift,    loop
    animation = fade,        1, 6,  drift
    animation = workspaces,  1, 5,  snap,     slidevert
}

dwindle {

    preserve_split = yes
}

master {
}

gestures {
}

$mainMod = SUPER

bind = $mainMod, T, exec, kitty
bind = $mainMod, B, exec, google-chrome-stable
bind = $mainMod, S, exec, spotify
bind = $mainMod, C, exec, claude-desktop
bind = $mainMod, A, exec, rofi -show drun -theme ~/.config/rofi/lunar.rasi
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/lunar.rasi | cliphist decode | wl-copy
bind = $mainMod CTRL, V, exec, cliphist list | grep -i '\[image\]' | head -1 | cliphist decode | wl-copy
bind = $mainMod, F, fullscreen

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, exec, env DISPLAY=:0 QT_QPA_PLATFORM=xcb jellyfin-desktop
bind = $mainMod, E, exec, nautilus
bind = $mainMod, N, exec, ~/.local/bin/rofi-smb

binde = $mainMod SHIFT, right, resizeactive,  30 0
binde = $mainMod SHIFT, left,  resizeactive, -30 0
binde = $mainMod SHIFT, up,    resizeactive,  0 -30
binde = $mainMod SHIFT, down,  resizeactive,  0  30

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , XF86AudioRaiseVolume,  exec, pamixer -i 5
bind = , XF86AudioLowerVolume,  exec, pamixer -d 5
bind = , XF86AudioMute,         exec, pamixer -t
bind = , XF86MonBrightnessUp,   exec, brightnessctl s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

bind = , print, exec, sh -c "grim -g '$(slurp)' - | tee ~/Pictures/screenshot-$(date +%F_%T).png | wl-copy"

device {
    name = dell0a69:00-0488:120a-mouse
    sensitivity = -0.5
    scroll_factor = 0.3
}

source = $HOME/.config/hypr/local.conf
