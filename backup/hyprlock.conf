# ╔══════════════════════════════════════════════════════╗
# ║         hyprlock.conf — LUNAR MOUNTAINS              ║
# ║   Palette drawn from alena-aenami-eclipse wallpaper  ║
# ║                                                      ║
# ║  deep void   #0D0A1A   orange fire  #F2833A          ║
# ║  crimson     #C0345D   warm cream   #F0EAD6          ║
# ║  soft purple #A07BC0   teal hint    #7AC0A0          ║
# ╚══════════════════════════════════════════════════════╝

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ── Background ────────────────────────────────────────────
background {
    monitor =
    path = /home/toby/Pictures/blackwolfshadow1-wolf-of-the-night.jpg

    blur_passes = 2
    blur_size = 6
    brightness = 0.60
    contrast = 1.1
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}

# ── Clock (large, centre-stage) ───────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    font_size = 96
    font_family = Nunito Bold

    color = rgba(F2833Aff)

    position = 0, 120
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0D0A1Acc)
    shadow_boost = 1.4
}

# ── Date ──────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    font_size = 22
    font_family = Nunito

    color = rgba(F0EAD6bb)

    position = 0, 40
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0D0A1Acc)
}

# ── Password input box ────────────────────────────────────
input-field {
    monitor =
    size = 320, 52

    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1

    inner_color  = rgba(0D0A1A99)
    outer_color  = rgba(F2833A55)
    check_color  = rgba(F2833Aff)
    fail_color   = rgba(C0345Dff)

    font_color   = rgba(F0EAD6ff)
    font_family  = Nunito

    placeholder_text = <i><span foreground="##F0EAD6">enter password...</span></i>
    fail_text        = <i><span foreground="##C0345D">$ATTEMPTS attempt(s) failed</span></i>
    fade_on_empty    = true
    hide_input       = false
    rounding         = 12

    position = 0, -80
    halign   = center
    valign   = center
}

# ── Hostname (top-left) ───────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo " $(hostname)"
    font_size = 13
    font_family = Nunito
    color = rgba(F2833A99)
    position = 28, -28
    halign = left
    valign = top
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0D0A1Acc)
}
